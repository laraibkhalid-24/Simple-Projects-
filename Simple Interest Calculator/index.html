<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Interest Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Simple Interest Calculator</h1>

    <div class="field">
      <label for="amount">Amount</label>
      <input type="number" id="amount" placeholder="Enter principal amount">
    </div>

    <div class="field">
      <label for="currency">Currency</label>
      <select id="currency">
        <option value="$" data-code="USD">USD ($)</option>
        <option value="₨" data-code="PKR">PKR (₨)</option>
        <option value="€" data-code="EUR">EUR (€)</option>
        <option value="£" data-code="GBP">GBP (£)</option>
        <option value="₹" data-code="INR">INR (₹)</option>
        <option value="¥" data-code="JPY">JPY (¥)</option>
        <option value="AED" data-code="AED">AED (د.إ)</option>
      </select>
    </div>

    <div class="field">
      <label for="rate">Rate</label>
      <input type="range" id="rate" min="0" max="50" step="0.25" value="10.25">
      <div class="rate-value" id="rateLabel">10.25 %</div>
    </div>

    <div class="field">
      <label for="depositYear">Deposit Year</label>
      <input type="number" id="depositYear" placeholder="e.g. 2026">
    </div>

    <div class="field">
      <label for="years">No. of Years</label>
      <input type="number" id="years" placeholder="Enter number of years">
    </div>

    <div class="result" id="result">
      Interest : If you deposit <span class="highlight" id="rAmount">—</span>,
      at an interest rate of <span class="highlight" id="rRate">—</span>
      You will receive an amount of <span class="highlight" id="rTotal">—</span>,
      in the year <span class="highlight" id="rYear">—</span>
    </div>

    <button onclick="computeInterest()">Compute Interest</button>

    <footer>© This Calculator belongs to --Laraib Khalid--</footer>
  </div>

<script src="script.js"></script>

</body>
</html>
